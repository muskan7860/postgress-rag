apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-rag
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/muskan7860/postgres-rag-gitops.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: postgress-rag

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
