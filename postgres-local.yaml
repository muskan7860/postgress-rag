apiVersion: v1
kind: Secret
metadata:
  name: postgres-rag-db
  namespace: monitoring
type: Opaque
stringData:
  POSTGRES_DB: postgres_rag
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres123

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-rag-pvc
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: microk8s-hostpath
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-rag-db
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-rag-db
  template:
    metadata:
      labels:
        app: postgres-rag-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-rag-db
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-rag-db
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-rag-db
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-rag-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-rag-db
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: postgres-rag-db
  ports:
    - port: 5432
      targetPort: 5432
